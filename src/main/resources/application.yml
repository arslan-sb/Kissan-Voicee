spring:
  application:
    name: kissan-voice-api
  datasource:
    url: jdbc:postgresql://localhost:5432/kissanvoice
    username: kissan
    password: kissan
  jpa:
    hibernate:
      ddl-auto: validate      # Flyway owns the schema, never Hibernate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:19092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: kissan-voice
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
    listener:
      ack-mode: record
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

kissanvoice:
  jwt:
    # Local-dev key only. Override with KISSANVOICE_JWT_SECRET in any deployed
    # environment; HS256 requires at least 32 bytes.
    secret: ${KISSANVOICE_JWT_SECRET:local-dev-only-change-me-kissan-voice-32b}
    ttl-hours: 24
    issuer: kissan-voice-api
  media:
    # local: writes under ./.media, no AWS setup needed - the default so
    #        tests and a bare `mvn spring-boot:run` never need LocalStack up.
    # s3:    S3MediaStorage against the LocalStack container in
    #        infra/docker-compose.yml. Switch with
    #        `--kissanvoice.media.provider=s3` or the `s3` profile below.
    provider: local
    local-root: ./.media
    bucket: kissan-voice-media
    s3-endpoint: http://localhost:4566   # LocalStack; blank/unset targets real AWS
    region: eu-central-1
    presign-ttl-minutes: 15
  crm:
    base-url: http://localhost:8081      # WireMock stand-in ("Unite CRM")
  n8n:
    milestone-webhook: http://localhost:5678/webhook/contributor-milestone
  milestone:
    threshold: 25
  outbox:
    poll-interval-ms: 500
    batch-size: 100
    send-timeout-ms: 5000

resilience4j:
  retry:
    instances:
      # Guards WireMockCrmAdapter. A handful of fast retries covers a blip;
      # anything past that is the circuit breaker's job, not this one's.
      crm:
        max-attempts: 4
        wait-duration: 200ms
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.HttpClientErrorException$TooManyRequests
          - org.springframework.web.client.ResourceAccessException
      # Guards the n8n webhook call in MilestoneListener - no circuit breaker,
      # since a single automation endpoint being briefly unreachable at
      # startup doesn't need the same protection as a CRM under load.
      n8n:
        max-attempts: 3
        wait-duration: 300ms
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
  circuitbreaker:
    instances:
      crm:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.HttpClientErrorException$TooManyRequests
          - org.springframework.web.client.ResourceAccessException

logging:
  level:
    com.kissanvoice: DEBUG
